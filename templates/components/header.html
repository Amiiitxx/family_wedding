{% load static %}

<header class="site-header" id="site-header" role="banner">

  <div class="header-inner container">

    <!-- Logo -->
    <a href="{% url 'core:home' %}" class="header-logo">
      <img
        src="{% static 'images/logo.png' %}"
        alt="Family Wedding Centre Logo"
        class="logo-img"
        width="180"
        height="60"
      />
    </a>

    <!-- Desktop Navigation -->
    <nav class="main-nav" aria-label="Main navigation" id="main-nav">
      <ul class="nav-list" role="list">

        <!-- Home -->
        <li>
          <a
            href="{% url 'core:home' %}"
            class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
          >
            Home
          </a>
        </li>

        <!-- About Us / Our Story -->
        <li>
          <a
            href="{% url 'core:our_story' %}"
            class="nav-link {% if request.resolver_match.url_name == 'our_story' %}active{% endif %}"
          >
            About Us
          </a>
        </li>

        <!-- Collections -->
        <li>
          <a
            href="{% url 'core:collections' %}"
            class="nav-link {% if request.resolver_match.url_name == 'collections' %}active{% endif %}"
          >
            Collections
          </a>
        </li>

        <!-- Our Brands -->
        <li>
          <a
            href="{% url 'core:brands' %}"
            class="nav-link {% if request.resolver_match.url_name == 'brands' %}active{% endif %}"
          >
            Our Brands
          </a>
        </li>

        <!-- Our Stores -->
        <li>
          <a
            href="{% url 'core:stores' %}"
            class="nav-link {% if request.resolver_match.url_name == 'stores' %}active{% endif %}"
          >
            Our Stores
          </a>
        </li>

        <!-- Gallery -->
        <li>
          <a
            href="{% url 'core:gallery' %}"
            class="nav-link {% if request.resolver_match.url_name == 'gallery' %}active{% endif %}"
          >
            Gallery
          </a>
        </li>

        <!-- Contact Us -->
        <li>
          <a
            href="{% url 'core:contact' %}"
            class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
          >
            Contact Us
          </a>
        </li>

      </ul>
    </nav>


    <!-- Header Actions -->
    <div class="header-actions">

      <a
        href="tel:{{ site_phone_raw }}"
        class="header-phone"
        aria-label="Call us at {{ site_phone }}"
      >

        <svg
          class="icon-phone"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >

          <path d="M22 16.92v3a2 2 0 01-2.18 2
          19.79 19.79 0 01-8.63-3.07
          A19.5 19.5 0 013.07 9.8
          a19.79 19.79 0 01-3.07-8.67
          A2 2 0 012 .01h3a2 2 0 012 1.72
          c.127.96.361 1.903.7 2.81
          a2 2 0 01-.45 2.11L6.09 7.91
          a16 16 0 006 6l1.27-1.27
          a2 2 0 012.11-.45
          c.907.339 1.85.573 2.81.7
          A2 2 0 0122 14.92z"
          />

        </svg>

        <span>{{ site_phone }}</span>

      </a>


      <a
        href="{% url 'core:contact' %}"
        class="btn btn-primary btn-sm header-enquire"
      >
        Enquire Now
      </a>

    </div>


    <!-- Mobile Hamburger -->
    <button
      class="hamburger"
      id="hamburger-btn"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >

      <span class="ham-line"></span>
      <span class="ham-line"></span>
      <span class="ham-line"></span>

    </button>

  </div>


  <!-- =========================
       MOBILE MENU
  ========================= -->
  <div
    class="mobile-menu"
    id="mobile-menu"
    aria-hidden="true"
    role="dialog"
    aria-label="Navigation menu"
  >

    <div class="mobile-menu-inner">

      <nav aria-label="Mobile navigation">

        <ul class="mobile-nav-list" role="list">

          <!-- Home -->
          <li>
            <a
              href="{% url 'core:home' %}"
              class="mobile-nav-link"
            >
              Home
            </a>
          </li>


          <!-- About Us / Our Story -->
          <li>
            <a
              href="{% url 'core:our_story' %}"
              class="mobile-nav-link"
            >
              About Us
            </a>
          </li>


          <!-- Collections -->
          <li>
            <a
              href="{% url 'core:collections' %}"
              class="mobile-nav-link"
            >
              Collections
            </a>
          </li>


          <!-- Our Brands -->
          <li>
            <a
              href="{% url 'core:brands' %}"
              class="mobile-nav-link"
            >
              Our Brands
            </a>
          </li>


          <!-- Our Stores -->
          <li>
            <a
              href="{% url 'core:stores' %}"
              class="mobile-nav-link"
            >
              Our Stores
            </a>
          </li>


          <!-- Gallery -->
          <li>
            <a
              href="{% url 'core:gallery' %}"
              class="mobile-nav-link"
            >
              Gallery
            </a>
          </li>


          <!-- Contact Us -->
          <li>
            <a
              href="{% url 'core:contact' %}"
              class="mobile-nav-link"
            >
              Contact Us
            </a>
          </li>

        </ul>

      </nav>


      <!-- Mobile Menu Footer -->
      <div class="mobile-menu-footer">

        <a
          href="tel:{{ site_phone_raw }}"
          class="mobile-phone-link"
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >

            <path d="M22 16.92v3a2 2 0 01-2.18 2
            19.79 19.79 0 01-8.63-3.07
            A19.5 19.5 0 013.07 9.8
            a19.79 19.79 0 01-3.07-8.67
            A2 2 0 012 .01h3a2 2 0 012 1.72
            c.127.96.361 1.903.7 2.81
            a2 2 0 01-.45 2.11L6.09 7.91
            a16 16 0 006 6l1.27-1.27
            a2 2 0 012.11-.45
            c.907.339 1.85.573 2.81.7
            A2 2 0 0122 14.92z"
            />

          </svg>

          {{ site_phone }}

        </a>


        <a
          href="{% url 'core:contact' %}"
          class="btn btn-primary mobile-enquire-btn"
        >
          Enquire Now
        </a>

      </div>

    </div>

  </div>


  <!-- Mobile Overlay -->
  <div
    class="mobile-overlay"
    id="mobile-overlay"
    aria-hidden="true"
  >
  </div>

</header>
